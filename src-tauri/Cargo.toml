[package]
name = "tally-app"
description = "Tally: fast, AI-driven money tables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tally-core = { version = "0.1.0", path = "../crates/tally-core", features = ["fetch", "pdf"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"

[dev-dependencies]
tempfile = "3.27.0"
