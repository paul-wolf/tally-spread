[package]
name = "tally-cli"
description = "Command line for Tally: update exchange rates (e.g. daily on the hub), convert amounts, query projects with SQL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tally"
path = "src/main.rs"

[dependencies]
tally-core = { path = "../tally-core", features = ["fetch", "pdf"] }
serde_json = "1.0.154"
chrono = "0.4.45"
duckdb = { version = "1.20000.0", features = ["bundled"] }
